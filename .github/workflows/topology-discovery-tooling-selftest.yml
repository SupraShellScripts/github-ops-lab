name: Topology discovery tooling self-test

on:
  workflow_dispatch:
  push:
    paths:
      - 'scripts/github/Invoke-TopologyDiscoveryProbe.ps1'
      - 'docs/topology-migration-discovery.md'
      - '.github/workflows/topology-discovery-tooling-selftest.yml'
  pull_request:
    paths:
      - 'scripts/github/Invoke-TopologyDiscoveryProbe.ps1'
      - 'docs/topology-migration-discovery.md'
      - '.github/workflows/topology-discovery-tooling-selftest.yml'

permissions:
  contents: read

jobs:
  public-safe-probe:
    runs-on: ubuntu-latest
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@08eba0b27e820071cde6df949e0beb9ba4906955 # v4

      - name: Install candidate discovery extensions
        shell: bash
        run: |
          set -euo pipefail
          gh extension install mona-actions/gh-stats
          gh extension install mona-actions/gh-repo-map

      - name: Parse probe script
        shell: pwsh
        run: |
          $errors = $null
          [void][System.Management.Automation.Language.Parser]::ParseFile(
            (Resolve-Path './scripts/github/Invoke-TopologyDiscoveryProbe.ps1'),
            [ref]$null,
            [ref]$errors
          )
          if ($errors.Count -gt 0) {
            $errors | ForEach-Object { Write-Error $_.Message }
            exit 1
          }

      - name: Probe extensions and gh-stats dry-run against public org
        shell: pwsh
        run: |
          ./scripts/github/Invoke-TopologyDiscoveryProbe.ps1 `
            -OutputDirectory "$env:RUNNER_TEMP/topology-discovery" `
            -PublicOrganization 'SupraShellScripts' `
            -RunPublicInventory

      - name: Assert public-safe probe outputs
        shell: pwsh
        run: |
          $root = Join-Path $env:RUNNER_TEMP 'topology-discovery'
          @(
            'extension-probe.json',
            'help-stats.txt',
            'help-repo-map.txt',
            'gh-stats-SupraShellScripts-dry-run.txt'
          ) | ForEach-Object {
            $path = Join-Path $root $_
            if (-not (Test-Path -LiteralPath $path)) {
              throw "Expected probe output missing: $path"
            }
          }

          $probe = Get-Content -Raw -LiteralPath (Join-Path $root 'extension-probe.json') | ConvertFrom-Json
          foreach ($command in @('stats', 'repo-map')) {
            $entry = $probe | Where-Object command -eq $command
            if (-not $entry -or -not $entry.installed -or $entry.help_exit_code -ne 0) {
              throw "Candidate extension probe failed for: $command"
            }
          }

      # Deliberately no artifact upload: even this public-only self-test establishes
      # the invariant that collector output remains local unless explicitly sanitized.
