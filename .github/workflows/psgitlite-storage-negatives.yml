name: PSGitLite object redirection native qualification
on:
  push:
    branches:
      - work/psgitlite-storage-negative-20261103
    paths:
      - 'tests/psgitlite-dle/**'
      - '.github/workflows/psgitlite-storage-negatives.yml'
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: psgitlite-storage-negative
  cancel-in-progress: false
jobs:
  windows_native:
    name: windows-2022 synthetic qualification
    runs-on: windows-2022
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify runtime
        shell: powershell
        run: |
          Write-Output ('PS version='+$PSVersionTable.PSVersion.ToString())
          if ($env:RUNNER_OS -eq 'Windows' -and $PSVersionTable.PSVersion.Major -ne 5) { throw 'WINPS5_REQUIRED' }
      - name: Test-DleObjectRedirectNative.ps1
        shell: powershell
        run: ./tests/psgitlite-dle/Test-DleObjectRedirectNative.ps1
      - name: Test-DleDeepNegative.ps1
        shell: powershell
        run: ./tests/psgitlite-dle/Test-DleDeepNegative.ps1
  linux_native:
    name: ubuntu-24.04 synthetic qualification
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
        with:
          persist-credentials: false
      - name: Verify runtime
        shell: pwsh
        run: |
          Write-Output ('PS version='+$PSVersionTable.PSVersion.ToString())
          if ($env:RUNNER_OS -eq 'Windows' -and $PSVersionTable.PSVersion.Major -ne 5) { throw 'WINPS5_REQUIRED' }
      - name: Test-DleObjectRedirectNative.ps1
        shell: pwsh
        run: ./tests/psgitlite-dle/Test-DleObjectRedirectNative.ps1
      - name: Test-DleDeepNegative.ps1
        shell: pwsh
        run: ./tests/psgitlite-dle/Test-DleDeepNegative.ps1
