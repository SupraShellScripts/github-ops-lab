name: Public bounded safety models
on:
  workflow_dispatch:
  push:
    paths:
      - tests/bounded-safety/**
      - .github/workflows/bounded-safety.yml
permissions:
  contents: read
concurrency:
  group: bounded-safety-${{ github.ref }}
  cancel-in-progress: true
jobs:
  tlc:
    name: TLC (${{ matrix.os }})
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-24.04
          - os: windows-2022
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8
        with:
          persist-credentials: false
      - name: Check bounded invariants on Linux
        if: runner.os == 'Linux'
        shell: pwsh
        run: ./tests/bounded-safety/Invoke-BoundedSafety.ps1
      - name: Check bounded invariants on native Windows PowerShell
        if: runner.os == 'Windows'
        shell: powershell
        run: ./tests/bounded-safety/Invoke-BoundedSafety.ps1
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: bounded-safety-${{ matrix.os }}
          path: artifacts/bounded-safety/*.json
          retention-days: 3
