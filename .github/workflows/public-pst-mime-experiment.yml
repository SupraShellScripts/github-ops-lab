name: Public PST MIME and attachment bakeoff

on:
  pull_request:
    paths:
      - 'qualification/public-pst/experiment_payloads.py'
      - '.github/workflows/public-pst-mime-experiment.yml'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-pst-mime-${{ github.ref }}
  cancel-in-progress: true

jobs:
  bounded-public-fixtures:
    runs-on: ubuntu-24.04
    timeout-minutes: 12
    steps:
      - name: Read-only source checkout
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false
      - name: Install independent distro readers
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends pff-tools pst-utils
          dpkg-query -W pff-tools pst-utils
          sha256sum "$(command -v pffexport)" "$(command -v readpst)"
          pffexport -V
          readpst -V
      - name: Self-test MIME summary and fail-closed behavior
        run: python3 qualification/public-pst/experiment_payloads.py --selftest
      - name: Probe nine pinned published PSTs with native readers and MIME parser
        shell: bash
        run: |
          set -euo pipefail
          umask 077
          ulimit -f 65536
          python3 qualification/public-pst/experiment_payloads.py --run
