name: Public surface native enforcement self-test

on:
  pull_request:
    paths:
      - 'scripts/github/reconcile-public-surface.py'
      - 'tests/public-surface-native-enforcement-selftest.py'
      - '.github/workflows/public-surface-native-enforcement.yml'
      - '.github/workflows/public-surface-native-enforcement-selftest.yml'
  push:
    branches: [main]
    paths:
      - 'scripts/github/reconcile-public-surface.py'
      - 'tests/public-surface-native-enforcement-selftest.py'
      - '.github/workflows/public-surface-native-enforcement.yml'
      - '.github/workflows/public-surface-native-enforcement-selftest.yml'

permissions:
  contents: read

jobs:
  selftest:
    runs-on: ubuntu-latest
    steps:
      - name: Check out exact revision
        uses: actions/checkout@08c6903cd8c0fde910a37f88322edcfb5dd907a8 # v5.0.0
        with:
          persist-credentials: false

      - name: Run deterministic reconciler self-test
        run: python3 ./tests/public-surface-native-enforcement-selftest.py
