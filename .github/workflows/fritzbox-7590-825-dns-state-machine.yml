name: FRITZ!Box 7590 8.25 DNS state-machine scan

on:
  pull_request:
    branches: [main]
    paths:
      - '.github/workflows/fritzbox-7590-825-dns-state-machine.yml'
      - 'experiments/fritzbox/dns_state_machine_scan.py'
      - 'experiments/fritzbox/dns_convergence_scan.py'
      - 'experiments/fritzbox/dns_boundary_scan.py'
      - 'experiments/fritzbox/dns_uimod_bridge_scan.py'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  analyze:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      FW_URL: https://download.avm.de/fritzbox/fritzbox-7590/deutschland/fritz.os/FRITZ.Box_7590-08.25.image
      FW_NAME: FRITZ.Box_7590-08.25.image
      FW_SHA256: 267ef427337d2141736ad6ed5d9389722a6a1234dd590bb7d4ebf11a00616c0d
    steps:
      - uses: actions/checkout@v4

      - name: Install extraction tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends curl file squashfs-tools binutils

      - name: Download exact official firmware
        id: firmware
        shell: bash
        run: |
          set -euo pipefail
          work="$RUNNER_TEMP/fritz-dns-sm"
          mkdir -p "$work/payload" "$work/roots" "$work/report"
          fw="$work/$FW_NAME"
          curl --fail --location --retry 4 --retry-all-errors --silent --show-error "$FW_URL" -o "$fw"
          actual="$(sha256sum "$fw" | awk '{print $1}')"
          test "$actual" = "$FW_SHA256"
          echo "work=$work" >> "$GITHUB_OUTPUT"
          printf 'source\t%s\nsha256\t%s\nbytes\t%s\n' "$FW_URL" "$actual" "$(stat -c '%s' "$fw")" > "$work/report/provenance.tsv"

      - name: Extract stock filesystem read-only
        shell: bash
        run: |
          set -euo pipefail
          work='${{ steps.firmware.outputs.work }}'
          fw="$work/$FW_NAME"
          tar -xf "$fw" -C "$work/payload"

          python3 - "$work" <<'PY'
          import pathlib, sys
          work=pathlib.Path(sys.argv[1])
          rows=[]
          for path in (work/'payload').rglob('*'):
              if not path.is_file() or path.stat().st_size < 4096:
                  continue
              try:
                  data=path.read_bytes()
              except OSError:
                  continue
              start=0
              while True:
                  off=data.find(b'hsqs', start)
                  if off < 0:
                      break
                  rows.append((str(path.relative_to(work/'payload')), off))
                  start=off+4
          with (work/'squashfs.tsv').open('w') as handle:
              for rel, off in rows:
                  handle.write(f'{rel}\t{off}\n')
          PY

          n=0
          while IFS=$'\t' read -r rel off; do
            [ -n "${rel:-}" ] || continue
            n=$((n+1))
            candidate="$work/squashfs-$n.img"
            dd if="$work/payload/$rel" of="$candidate" bs=1 skip="$off" status=none
            if ! unsquashfs -d "$work/roots/root-$n" "$candidate" >/dev/null 2>&1; then
              rm -rf "$work/roots/root-$n"
            fi
            rm -f "$candidate"
          done < "$work/squashfs.tsv"

          target="$(find "$work/roots" -type f -path '*/usr/www/avm/internet/dnsserver.lua' -print -quit)"
          if [ -z "$target" ]; then
            echo 'dnsserver.lua not found in extracted filesystem' >&2
            exit 1
          fi
          root="${target%/usr/www/avm/internet/dnsserver.lua}"
          printf '%s' "$root" > "$work/root-path.txt"

      - name: Derive sanitized DNS state-machine evidence
        shell: bash
        run: |
          set -euo pipefail
          work='${{ steps.firmware.outputs.work }}'
          root="$(cat "$work/root-path.txt")"
          python experiments/fritzbox/dns_state_machine_scan.py "$root" --output "$work/report/dns"
          cat "$work/report/dns/summary.md"
          echo '--- identifiers ---'
          head -n 120 "$work/report/dns/identifiers.tsv"
          echo '--- ui controls ---'
          head -n 120 "$work/report/dns/ui-controls.tsv"
          echo '--- guard signatures ---'
          head -n 120 "$work/report/dns/guard-signatures.tsv"

      - name: Derive focused DNS UI/API convergence candidates
        shell: bash
        run: |
          set -euo pipefail
          work='${{ steps.firmware.outputs.work }}'
          root="$(cat "$work/root-path.txt")"
          python experiments/fritzbox/dns_convergence_scan.py "$root" --output "$work/report/convergence"
          cat "$work/report/convergence/convergence-summary.md"
          echo '--- implementation path candidates ---'
          head -n 120 "$work/report/convergence/convergence-path-candidates.tsv"
          echo '--- relevant co-occurrence ---'
          grep -E 'api_generic|dnsserver\.data|dnscfg\.data|internet/dnsserver|libcmapi|rest_api_resources' "$work/report/convergence/convergence-cooccurrence.tsv" | head -n 120 || true

      - name: Derive focused DNS API/configuration boundary evidence
        shell: bash
        run: |
          set -euo pipefail
          work='${{ steps.firmware.outputs.work }}'
          root="$(cat "$work/root-path.txt")"
          python experiments/fritzbox/dns_boundary_scan.py "$root" --output "$work/report/boundary"
          cat "$work/report/boundary/boundary-summary.md"
          echo '--- text boundary calls ---'
          head -n 160 "$work/report/boundary/boundary-text-calls.tsv"
          echo '--- ELF dependency edges ---'
          cat "$work/report/boundary/boundary-elf-dependencies.tsv"
          echo '--- filtered ELF symbols ---'
          head -n 240 "$work/report/boundary/boundary-elf-symbols.tsv"
          echo '--- anchor offsets ---'
          cat "$work/report/boundary/boundary-anchor-offsets.tsv"

      - name: Trace REST generic API to Uimod bridge only
        shell: bash
        run: |
          set -euo pipefail
          work='${{ steps.firmware.outputs.work }}'
          root="$(cat "$work/root-path.txt")"
          python experiments/fritzbox/dns_uimod_bridge_scan.py "$root" --output "$work/report/uimod-bridge"
          cat "$work/report/uimod-bridge/uimod-bridge-summary.md"
          echo '--- relevant functions ---'
          cat "$work/report/uimod-bridge/uimod-bridge-functions.tsv"
          echo '--- candidate bridge edges ---'
          cat "$work/report/uimod-bridge/uimod-bridge-edges.tsv"

      - name: Delete proprietary payloads and verify report boundary
        shell: bash
        run: |
          set -euo pipefail
          work='${{ steps.firmware.outputs.work }}'
          rm -f "$work/$FW_NAME" "$work/root-path.txt" "$work/squashfs.tsv"
          rm -rf "$work/payload" "$work/roots"
          test ! -e "$work/$FW_NAME"
          if find "$work/report" -type f -size +2M -print -quit | grep -q .; then
            echo 'Refusing unexpectedly large derived report.' >&2
            exit 1
          fi
          find "$work/report" -type f -printf '%P\t%s\n' | sort

      - name: Upload sanitized derived evidence only
        uses: actions/upload-artifact@v4
        with:
          name: fritzbox-7590-8.25-dns-state-machine-candidates
          path: ${{ runner.temp }}/fritz-dns-sm/report/
          if-no-files-found: error
          retention-days: 7
